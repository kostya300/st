{% if baskets %}
	<input type="hidden" id="csrftoken" value="{{ csrf_token }}">

	<h4 class="mt-3 mb-3 d-flex justify-content-between align-items-center mb-3">
		Корзина <span class="badge badge-secondary badge-pill">{{ total_quantity }}</span>
	</h4>

	{% for basket in baskets %}
		<div class="card mb-3" id="basket-item-{{ basket.id }}">
			<div class="card-body">
				<h5 class="card-title"> {{ basket.products_id.name }}</h5>
				<p class="card-text">{{ basket.products_id.description }}</p>
			</div>
			<ul class="             list-group list-group-flush">
				<li class="list-group-item bg-light">
					<div class="row text-center">

						<div class="col-lg-4">

							<input class="form-control" type="number"
							       id="quantity-{{ basket.id }}"
							       value="{{ basket.quantity }}"
							       data-basket-id="{{ basket.id }}"
							       min="0"
							       onchange="updateBasketQuantity(this)"

							>

						</div>

						<div class="col-lg-4">

							<span id="total-{{ basket.id }}">{{ basket.sum }}</span> руб.
						</div>
						<div class="col-lg-4">
							<a href="{% url 'products:basket_remove' basket.id %}">
								<i class="fas fa-trash"></i>
							</a>
						</div>
					</div>
				</li>
			</ul>
		</div>
	{% endfor %}

	<div class="card mb-3">
		<div class="card-footer">
			<p class="float-left">Итого</p>
			<h4 class="float-right" id="total-basket">{{ total_sum }} руб.</h4>
		</div>
	</div>

	<a class="btn btn-success btn-lg float-right" href="../orders/order-create.html">
		Оформить заказ
	</a>

	<script>
		function updateBasketQuantity(input) {
			const basketId = input.dataset.basketId;
			const newQuantity = parseInt(input.value);

			fetch(`/prod/basket/update/${basketId}/`, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					'X-CSRFToken': document.getElementById('csrftoken').value
				},
				body: JSON.stringify({quantity: newQuantity})
			})
					.then(response => response.json())
					.then(data => {
						if (data.success) {
							// 1. Обновляем сумму для конкретного товара
							document.getElementById(`total-${basketId}`).textContent =
									data.total.toFixed(2);

							// 2. Обновляем общую сумму корзины
							document.getElementById('total-basket').textContent =
									data.total_basket.toFixed(2) + ' руб.';

							// 3. Если количество = 0, удаляем товар из DOM
							if (newQuantity === 0) {
								document.getElementById(`basket-item-${basketId}`).remove();
							}
						} else {
							alert('Ошибка: ' + data.error);
						}
					})
					.catch(error => console.error('Ошибка:', error));
		}
	</script>
{% else %}
	<h4 class="mt-3 mb-3 text-center">Корзина пуста</h4>
{% endif %}
