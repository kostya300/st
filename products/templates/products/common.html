{% extends 'products/base.html' %}
{% load static %}


{% block css %}
	<link href="{% static 'vendor/css/index.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
	<section>
    <div class="container">
        <div class="row">
            <div class="col-lg-6">
                <h1 class="mt-5">Магазин</h1>
                <p>
                    Новые образы и лучшие бренды.
	                {% if is_promotion %}
                    Бесплатная доставка по всему миру! Аутлет: до -70% Собственный бренд. -20% новым покупателям.
	                {% endif %}
                </p>
                <button id="start-purchase-btn" type="button" class="btn btn-lg commonlink_start_purches">
                    <a id="start-purchase-link" href="{% url 'products:catalog_general' %}">
                        Начать покупки!
                    </a>
                </button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
