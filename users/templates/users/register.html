{% extends 'users/base.html' %}
{% block content %}
	<main>
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-7">
					{% if form.non_field_errors %}
						<div class="alert alert-warning alert-dismissible fade show" role="alert"
						     style="margin-top: 50px;">
							{{ form.non_field_errors }}
							<button type="button" class="close" data-dismiss="alert" aria-label="Close">
								<span aria-hidden="true">&times;</span>
							</button>
						</div>
					{% endif %}
					<div class="card shadow-lg border-0 rounded-lg mt-5">
						<div class="card-header"><h3 class="text-center font-weight-light my-4">Создать аккаунт</h3>
						</div>
						<div class="card-body">
							<form action="{% url 'users:register' %}" method="POST">
								{% csrf_token %}
								<div class="form-row">
									<div class="col-md-6">
										<div class="form-group">
											<label class="small mb-1" for="inputFirstName">Имя</label>
											<input class="form-control py-4" id="inputFirstName" type="text"
											       placeholder="Введите имя" name="first_name"/>
										</div>
									</div>
									<div class="col-md-6">
										<div class="form-group">
											<label class="small mb-1" for="inputLastName">Фамилия</label>
											<input class="form-control py-4" id="inputLastName" type="text"
											       placeholder="Введите фамилию" name="last_name"/>
										</div>
									</div>
								</div>
								<div class="form-row">
									<div class="col-md-6">
										<label class="small mb-1" for="inputUsername">Имя пользователя</label>
										<input class="form-control py-4" id="inputUsername" type="text"
										       aria-describedby="usernameHelp"
										       placeholder="Введите имя пользователя" name="username"/>
									</div>
									<div class="col-md-6">
										<label class="small mb-1" for="inputEmailAddress">Адрес электронной
											почты</label>
										<input class="form-control py-4" id="inputEmailAddress" type="email"
										       aria-describedby="emailHelp"
										       placeholder="Введите адрес эл. почты" name="email"/>
									</div>
								</div>
								<div class="form-row">
									<div class="col-md-6">
										<div class="form-group">
											<label class="small mb-1" for="inputPassword">Пароль</label>
											<input class="form-control py-4" id="inputPassword" type="password"
											       placeholder="Введите пароль" name="password1"/>
										</div>
									</div>
									<div class="col-md-6">
										<div class="form-group">
											<label class="small mb-1" for="inputConfirmPassword">Подтверждение
												пароля</label>
											<input class="form-control py-4" id="inputConfirmPassword"
											       type="password" placeholder="Подтвердите пароль" name="password2"/>
										</div>
									</div>
								</div>
								<div class="form-group mt-4 mb-0">
									<input class="btn btn-primary btn-block" type="submit" value="Создать аккаунт">
								</div>
							</form>
						</div>
						<div class="card-footer text-center">
							<div class="small"><a href="{% url 'users:login' %}">Уже есть аккаунт? Авторизоваться</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
{% endblock %}
